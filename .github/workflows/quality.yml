name: Game quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game JavaScript syntax
        run: node --check app.js
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Check smoke-test syntax
        run: node --check tests/smoke.cjs
      - name: Check browser-test syntax
        run: node --check tests/browser.cjs
      - name: Run game smoke tests
        run: node tests/smoke.cjs
      - name: Run regression checks
        run: node --test tests/quality.test.cjs
      - name: Check life-simulation stress-test syntax
        run: node --check tests/life-simulation.test.cjs
      - name: Run deterministic life-simulation stress test
        run: node --test tests/life-simulation.test.cjs
      - name: Check business-simulation test syntax
        run: node --check tests/business-simulation.test.cjs
      - name: Run business annual-settlement regression tests
        run: node --test tests/business-simulation.test.cjs
      - name: Check business market-test syntax
        run: node --check tests/business-market-simulation.test.cjs
      - name: Run business market and product simulation tests
        run: node --test tests/business-market-simulation.test.cjs
      - name: Check integrated business-lifecycle test syntax
        run: node --check tests/business-lifecycle.test.cjs
      - name: Run 30-year integrated business-lifecycle tests
        run: node --test tests/business-lifecycle.test.cjs
      - name: Check family-succession test syntax
        run: node --check tests/family-succession.test.cjs
      - name: Run family development and business-succession tests
        run: node --test tests/family-succession.test.cjs
      - name: Test offline service-worker behavior
        run: node --test tests/service-worker.test.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run mobile browser end-to-end tests
        run: node tests/browser.cjs
