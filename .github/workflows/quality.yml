name: Game quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game JavaScript syntax
        run: node --check app.js
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Check smoke-test syntax
        run: node --check tests/smoke.cjs
      - name: Check auto-racing regression test syntax
        run: node --check tests/auto-racing.test.cjs
      - name: Run deterministic auto-racing regression tests
        run: node --test tests/auto-racing.test.cjs
      - name: Check business ownership regression test syntax
        run: node --check tests/business-ownership.test.cjs
      - name: Run business ownership and inheritance tests
        run: node --test tests/business-ownership.test.cjs
      - name: Check browser-test syntax
        run: node --check tests/browser.cjs
      - name: Check activity-hub regression test syntax
        run: node --check tests/activity-hub.test.cjs
      - name: Run activity-hub regression tests
        run: node --test tests/activity-hub.test.cjs
      - name: Check combat-range regression test syntax
        run: node --check tests/combat-range.test.cjs
      - name: Run combat-range regression tests
        run: node --test tests/combat-range.test.cjs
      - name: Check combat balance regression test syntax
        run: node --check tests/combat-balance.test.cjs
      - name: Run deterministic combat strategy balance matrix
        run: node --test tests/combat-balance.test.cjs
      - name: Check combat community regression test syntax
        run: node --check tests/combat-community.test.cjs
      - name: Run combat community lifecycle and social interaction tests
        run: node --test tests/combat-community.test.cjs
      - name: Check combat scouting regression test syntax
        run: node --check tests/combat-scouting.test.cjs
      - name: Run rival scouting and adaptive counter tests
        run: node --test tests/combat-scouting.test.cjs
      - name: Check combat coach prison guard test syntax
        run: node --check tests/combat-coach-prison.test.cjs
      - name: Run combat coach prison guard regression tests
        run: node --test tests/combat-coach-prison.test.cjs
      - name: Check combat integrity regression test syntax
        run: node --check tests/combat-integrity.test.cjs
      - name: Run combat integrity and pre-fight screening tests
        run: node --test tests/combat-integrity.test.cjs
      - name: Run game smoke tests
        run: node tests/smoke.cjs
      - name: Run regression checks
        run: node --test tests/quality.test.cjs
      - name: Check life-simulation stress-test syntax
        run: node --check tests/life-simulation.test.cjs
      - name: Run deterministic life-simulation stress test
        run: node --test tests/life-simulation.test.cjs
      - name: Check business-simulation test syntax
        run: node --check tests/business-simulation.test.cjs
      - name: Run business annual-settlement regression tests
        run: node --test tests/business-simulation.test.cjs
      - name: Check business market-test syntax
        run: node --check tests/business-market-simulation.test.cjs
      - name: Run business market and product simulation tests
        run: node --test tests/business-market-simulation.test.cjs
      - name: Check integrated business-lifecycle test syntax
        run: node --check tests/business-lifecycle.test.cjs
      - name: Run 30-year integrated business-lifecycle tests
        run: node --test tests/business-lifecycle.test.cjs
      - name: Check family-succession test syntax
        run: node --check tests/family-succession.test.cjs
      - name: Run family development and business-succession tests
        run: node --test tests/family-succession.test.cjs
      - name: Test offline service-worker behavior
        run: node --test tests/service-worker.test.cjs
      - name: Check spouse estate portfolio test syntax
        run: node --check tests/spouse-portfolio.test.cjs
      - name: Run spouse estate portfolio regression tests
        run: node --test tests/spouse-portfolio.test.cjs
      - name: Check inherited child property management test syntax
        run: node --check tests/child-property-management.test.cjs
      - name: Run inherited child property management tests
        run: node --test tests/child-property-management.test.cjs
      - name: Check time-machine safety test syntax
        run: node --check tests/time-machine-safety.test.cjs
      - name: Run time-machine and cemetery consistency tests
        run: node --test tests/time-machine-safety.test.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Check expanded large-text browser test syntax
        run: node --check tests/accessibility-large-text.browser.cjs
      - name: Run mobile browser end-to-end tests
        run: node tests/browser.cjs
      - name: Run expanded large-text accessibility browser checks
        run: node tests/accessibility-large-text.browser.cjs
