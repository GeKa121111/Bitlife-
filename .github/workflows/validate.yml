name: Validate Hekayat Hayah
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check backup integrity helper syntax
        run: node --check backup-integrity.js
      - name: Check backup checker syntax
        run: node --check backup-check.js
      - name: Run backup checker regression tests
        run: node --test tests/backup-check.test.cjs
      - name: Check business ownership test syntax
        run: node --check tests/business-ownership.test.cjs
      - name: Run business ownership and inheritance tests
        run: node --test tests/business-ownership.test.cjs
      - name: Check business insights syntax
        run: node --check business-insights.js
      - name: Run business insights and ownership audit tests
        run: node --test tests/business-insights.test.cjs
      - name: Check film distribution test syntax
        run: node --check tests/film-distribution.test.cjs
      - name: Run film distribution contract tests
        run: node --test tests/film-distribution.test.cjs
      - name: Check film rights forecast syntax
        run: node --check film-rights-forecast.js
      - name: Run film rights forecast tests
        run: node --test tests/film-rights-forecast.test.cjs
      - name: Run game smoke tests
        run: node tests/smoke.cjs
      - name: Check required game files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s backup-integrity.js
          test -s film-rights-forecast.js
          test -s film-rights-forecast.css
          grep -q 'id="lifeFeed"' index.html
          grep -q 'id="ageUpBtn"' index.html
          grep -q 'function ageUp' app.js
          echo "Required game files and entry points are present."
