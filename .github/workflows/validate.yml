name: Validate Hekayat Hayah
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required game files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          grep -q 'id="lifeFeed"' index.html
          grep -q 'id="ageUpBtn"' index.html
          grep -q 'function ageUp' app.js
          echo "Required game files and entry points are present."
